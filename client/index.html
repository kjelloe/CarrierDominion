<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrier Dominion</title>
  <style>
    :root {
      color-scheme: dark;
      /* The retro defaults, overwritten from client/styles.js once the chosen
         style loads. They match so the first paint is not a blue flash. */
      --hud-ink: #ffb03a;
      --hud-dim: #a06a14;
      --hud-panel: rgba(0, 0, 0, 0.82);
      --hud-font: ui-monospace, "Courier New", monospace;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; }
    #view { display: block; width: 100vw; height: 100vh; }
    /* The diagnostic strip. The instruments below say what the ship is doing;
       this says what the SIMULATION is doing, which is a different audience. */
    #hud {
      position: fixed; top: 44px; left: 12px; min-width: 220px;
      padding: 10px 12px; border-radius: 6px;
      background: var(--hud-panel); color: var(--hud-ink);
      font: 12px/1.5 var(--hud-font);
      pointer-events: none; user-select: none;
    }
    #hud.hidden { display: none; }
    /* The diagnostic strip's own switch, upper-left (playtest ruling): the
       instruments are for playing, the strip is for debugging. */
    #debug-button {
      position: fixed; top: 10px; left: 12px; z-index: 8;
      padding: 4px 10px; border: 1px solid var(--hud-dim); border-radius: 4px;
      background: var(--hud-panel); color: var(--hud-dim);
      font: 11px var(--hud-font); letter-spacing: 2px;
      cursor: pointer; user-select: none;
    }
    #debug-button:hover, #debug-button.open {
      color: var(--hud-ink); border-color: var(--hud-ink);
    }
    /* Status feedback while the strip is hidden: one transient line, centred
       above the instruments, gone in a couple of seconds. */
    #toast {
      position: fixed; left: 50%; bottom: 216px; transform: translateX(-50%);
      padding: 4px 14px; border-radius: 4px;
      background: var(--hud-panel); color: var(--hud-ink);
      font: 12px var(--hud-font); user-select: none; pointer-events: none;
      opacity: 0; transition: opacity 0.25s;
    }
    #toast.on { opacity: 1; }
    /* The 1988 icon columns: every action in the key list, clickable, with
       the key it mirrors printed on the button - the UI teaches the keyboard. */
    .actions {
      position: fixed; top: 56px; bottom: 216px; z-index: 7;
      display: flex; flex-direction: column; gap: 6px;
      user-select: none;
    }
    /* Centered by auto margins, NOT justify-content: center - a centered
       flex column that overflows its box overflows in BOTH directions and
       scroll cannot reach the top (a landscape phone found this: the launch
       button sat 226 px above the screen). Auto margins centre when the
       column fits and collapse to zero when it scrolls. */
    .actions::before, .actions::after { content: ''; }
    .actions::before { margin-top: auto; }
    .actions::after { margin-bottom: auto; }
    #actions-left { left: 10px; }
    #actions-right { right: 10px; }
    .act {
      width: 58px; padding: 4px 0 3px; text-align: center; cursor: pointer;
      border: 1px solid var(--hud-dim); border-radius: 4px;
      background: var(--hud-panel); color: var(--hud-dim);
      font: 11px/1.2 var(--hud-font);
    }
    .act:hover { color: var(--hud-ink); border-color: var(--hud-ink); }
    .act .k {
      display: block; font-size: 15px; color: var(--hud-ink); letter-spacing: 1px;
    }
    .act .l { display: block; font-size: 9px; letter-spacing: 1px; }
    body.menu .actions, body.menu #debug-button { display: none; }
    /* Touch (ruling 2026-08-23, basic pass - real devices still to judge):
       the browser must not scroll or pinch the bridge, a coarse pointer
       gets bigger targets, and a phone held upright gets the rotate card -
       the instrument strip plus two icon columns cannot share 400 px of
       width. The MENU stays usable in portrait; only the war demands the
       width (body.menu lifts the gate). */
    #view, #panel { touch-action: none; }
    /* pan-y, not none: a landscape phone is 412 px tall and the right
       column overran it the moment the probe looked (the launch button sat
       below the screen) - the columns scroll under a finger instead. */
    .actions { touch-action: pan-y; overflow-y: auto; }
    @media (pointer: coarse) {
      .act { padding: 10px 12px; }
      .act .k { font-size: 16px; }
      .act .l { font-size: 11px; }
    }
    #rotate-gate {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: #05070b; color: var(--hud-ink);
      font: 16px/1.8 var(--hud-font); letter-spacing: 2px; padding: 40px;
    }
    @media (orientation: portrait) and (pointer: coarse) and (max-width: 820px) {
      body:not(.menu) #rotate-gate { display: flex; }
    }
    /* Hover tooltips for every button (playtest ruling 2026-08-23): what the
       button DOES, after a deliberate pause - labels name, tooltips explain. */
    #tip {
      position: fixed; z-index: 20; max-width: 240px;
      padding: 5px 9px; border: 1px solid var(--hud-dim); border-radius: 4px;
      background: var(--hud-panel); color: var(--hud-ink);
      font: 11px/1.4 var(--hud-font); pointer-events: none; user-select: none;
      opacity: 0; transition: opacity 0.15s;
    }
    #tip.on { opacity: 1; }
    /* The weapon selector: one button per weapon the selected hull carries,
       radio-style - the chosen one lit, the others dark. */
    #weapon-group {
      display: flex; flex-direction: column; gap: 3px;
      border: 1px solid var(--hud-dim); border-radius: 4px; padding: 3px;
      background: var(--hud-panel);
    }
    .wep {
      padding: 3px 4px; text-align: center; cursor: pointer;
      border: 1px solid transparent; border-radius: 3px;
      color: var(--hud-dim); font: 10px/1.3 var(--hud-font); letter-spacing: 1px;
    }
    .wep:hover { color: var(--hud-ink); }
    .wep.on {
      color: var(--hud-panel); background: var(--hud-ink);
      border-color: var(--hud-ink);
    }
    .wep .n { display: block; font-size: 9px; letter-spacing: 0; }
    /* The 1988 panel: bezelled instruments across the bottom. */
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; height: 196px;
      pointer-events: none; user-select: none;
    }
    .hud-row { display: flex; justify-content: space-between; gap: 18px; }
    .hud-label { color: var(--hud-dim); }
    .hud-value { color: var(--hud-ink); }
    #help {
      position: fixed; bottom: 206px; left: 12px;
      padding: 8px 12px; border-radius: 6px;
      background: var(--hud-panel); color: var(--hud-dim);
      font: 12px/1.6 var(--hud-font);
      pointer-events: none; user-select: none;
    }
    #gpu { color: var(--hud-dim); opacity: 0.75; }
    #help.hidden { display: none; }
    /* The key list lives behind a question mark, not on the screen (playtest
       ruling): the instruments are the interface, the legend is the manual. */
    #help-button {
      position: fixed; top: 10px; right: 10px; z-index: 8;
      width: 28px; height: 28px; line-height: 28px; text-align: center;
      border: 1px solid var(--hud-dim); border-radius: 50%;
      background: var(--hud-panel); color: var(--hud-dim);
      font: 16px var(--hud-font); cursor: pointer; user-select: none;
    }
    #help-button:hover, #help-button.open {
      color: var(--hud-ink); border-color: var(--hud-ink);
    }
    /* The gunsight. Only visible with a hull under direct control, because it
       is only then that where the nose points decides where the round goes. */
    #sight {
      position: fixed; left: 50%; top: 50%; width: 46px; height: 46px;
      margin: -23px 0 0 -23px; display: none; pointer-events: none;
    }
    #sight.on { display: block; }
    #sight .bar { position: absolute; background: var(--hud-ink); opacity: 0.85; }
    #sight .h { left: 0; right: 0; top: 50%; height: 1px; }
    #sight .v { top: 0; bottom: 0; left: 50%; width: 1px; }
    #sight .gap { background: transparent; }
    #sight .ring {
      position: absolute; inset: 12px; border: 1px solid var(--hud-ink);
      border-radius: 50%; opacity: 0.7;
    }
    #sight.lock .ring { border-color: #ff5f3a; opacity: 1; }
    /* Something has locked onto the ship. The sight says so even when you are
       not flying, because it is the ship that is being shot at. */
    #sight.warn { display: block; }
    #sight.warn .ring { border-color: #ff2d1a; border-width: 2px; animation: pulse 0.7s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    /* The damage control board: hidden until Z, and pointer-active when open -
       it is the one part of the overlay you click rather than read. */
    #damage-panel {
      /* Top-right and bounded, so it never sits over the instrument panel. */
      position: fixed; top: 24px; right: 24px;
      width: 420px; max-height: calc(100vh - 240px); overflow: auto;
      padding: 12px 14px; border-radius: 6px;
      background: var(--hud-panel); color: var(--hud-ink);
      font: 12px/1.5 var(--hud-font);
      display: none; user-select: none;
    }
    #damage-panel.open { display: block; }
    #damage-title { letter-spacing: 2px; margin-bottom: 8px; }
    #damage-view { display: block; width: 100%; height: 220px; cursor: crosshair; }
    .damage-row { display: flex; justify-content: space-between; gap: 12px; cursor: pointer; }
    .damage-row:hover { color: var(--hud-ink); text-decoration: underline; }
    .damage-name { color: var(--hud-dim); }
    #damage-legend, #damage-stores { color: var(--hud-dim); margin-top: 8px; }
    /* The island board: what a captured island is for, and what is going up on
       it. Opens by clicking an island you hold. */
    #island-panel {
      /* Above the instrument panel and clear of the legend. */
      position: fixed; left: 50%; bottom: 360px; transform: translateX(-50%);
      min-width: 420px; padding: 12px 14px; border-radius: 6px;
      background: var(--hud-panel); color: var(--hud-ink);
      font: 12px/1.5 var(--hud-font);
      display: none; user-select: none;
    }
    #island-panel.open { display: block; }
    #island-title { letter-spacing: 2px; margin-bottom: 8px; }
    .island-row { display: flex; justify-content: space-between; gap: 18px; }
    .island-act { cursor: pointer; }
    .island-act:hover { text-decoration: underline; }
    .island-act.off { color: var(--hud-dim); cursor: default; text-decoration: none; }
    #island-note { color: var(--hud-dim); margin-top: 8px; }
    /* The quartermaster (Q): where the goods are, and what the plants make
       next. Left side, clear of the icon column. */
    #stores-panel {
      position: fixed; top: 56px; left: 80px;
      width: 380px; max-height: calc(100vh - 280px); overflow: auto;
      padding: 12px 14px; border-radius: 6px;
      background: var(--hud-panel); color: var(--hud-ink);
      font: 12px/1.6 var(--hud-font);
      display: none; user-select: none;
    }
    #stores-panel.open { display: block; }
    #stores-title { letter-spacing: 2px; margin-bottom: 8px; }
    #stores-bias { margin-bottom: 10px; border-bottom: 1px solid var(--hud-dim); padding-bottom: 8px; }
    #stores-refit { margin-bottom: 10px; border-bottom: 1px solid var(--hud-dim); padding-bottom: 8px; }
    .stores-upgrade { cursor: pointer; }
    .stores-upgrade:hover .stores-label { color: var(--hud-ink); }
    .stores-row { display: flex; gap: 8px; align-items: center; }
    .stores-label { flex: 1; color: var(--hud-dim); }
    .bias-cell {
      padding: 1px 8px; border: 1px solid var(--hud-dim); border-radius: 3px;
      cursor: pointer; color: var(--hud-dim);
    }
    .bias-cell:hover { color: var(--hud-ink); border-color: var(--hud-ink); }
    .bias-cell.on { background: var(--hud-ink); color: var(--hud-panel); border-color: var(--hud-ink); }
    .stores-island { cursor: pointer; }
    .stores-island:hover .stores-label { color: var(--hud-ink); }
    .stores-island.depot .stores-label { color: var(--hud-ink); }
    #stores-note { color: var(--hud-dim); margin-top: 8px; font-size: 11px; }
    /* The start menu: what war you are about to fight. Shown only when the URL
       does not already say - a link with ?mode= is somebody who has chosen. */
    #start-panel {
      position: fixed; inset: 0; display: none; z-index: 10;
      align-items: center; justify-content: center;
      background: #05070b; color: var(--hud-ink);
      font: 14px/1.9 var(--hud-font); user-select: none;
    }
    #start-panel.open { display: flex; }
    /* The diorama canvas sits between the (idle) war canvas and the menu;
       with it running, the menu thins to a scrim and its inner box carries
       its own panel so the options stay readable over the action. */
    #diorama { position: fixed; inset: 0; z-index: 5; display: block; }
    #start-panel.showcase { background: rgba(3, 6, 10, 0.28); }
    #start-panel.showcase #start-inner {
      background: rgba(4, 8, 12, 0.84);
      border: 1px solid var(--hud-dim);
      padding: 24px 32px;
    }
    /* The title card: the game's name over the diorama, above the scrim,
       never in the way of a click. The solo menu's own small header would
       repeat it, so that one steps aside; the war room's header carries the
       join code and stays. */
    #title-card {
      position: fixed; top: 5%; left: 0; right: 0; z-index: 11;
      display: none; text-align: center; pointer-events: none;
      color: var(--hud-ink); font: 42px/1.2 var(--hud-font);
      letter-spacing: 20px; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.9);
    }
    body.showcase #title-card { display: block; }
    /* The war room's roster stands tall and its header already names the
       table (and carries the join code) - there the card yields. */
    body.war-room #title-card { display: none; }
    #title-card::after {
      content: ''; display: block; width: 340px; margin: 12px auto 0;
      border-bottom: 1px solid var(--hud-dim);
    }
    #start-panel.showcase.solo-menu #start-title { display: none; }
    /* Nothing behind the menu: the instruments belong to a war that has not
       started yet, and reading them through it is worse than not seeing them. */
    body.menu #hud, body.menu #help { display: none; }
    #start-inner { min-width: 460px; }
    #start-title { letter-spacing: 6px; margin-bottom: 18px; font-size: 20px; }
    .start-row {
      display: flex; justify-content: space-between; gap: 40px; cursor: pointer;
      padding: 2px 0;
    }
    .start-row:hover .start-value { text-decoration: underline; }
    #start-begin {
      margin-top: 20px; padding: 6px 0; text-align: center; cursor: pointer;
      border: 1px solid var(--hud-ink); letter-spacing: 4px;
    }
    #start-begin:hover { background: var(--hud-ink); color: #05070b; }
    #start-note { color: var(--hud-dim); margin-top: 14px; font-size: 12px; }
    #lobby-chat { margin-top: 16px; border-top: 1px solid var(--hud-dim); padding-top: 10px; }
    #lobby-log { min-height: 84px; max-height: 140px; overflow-y: auto; font-size: 12px; }
    #lobby-log div { line-height: 1.5; }
    #lobby-log .who { color: var(--hud-dim); }
    #lobby-say {
      width: 100%; margin-top: 6px; padding: 4px 6px;
      background: transparent; color: var(--hud-ink);
      border: 1px solid var(--hud-dim); font: 12px var(--hud-font);
    }
    #lobby-say:focus { outline: none; border-color: var(--hud-ink); }
    /* The war-over screen: the result, over a world that keeps winding down
       behind it. Semi-transparent on purpose - KEEP WATCHING is a real offer. */
    #warover-panel {
      position: fixed; inset: 0; display: none; z-index: 9;
      align-items: center; justify-content: center;
      background: rgba(5, 7, 11, 0.93); color: var(--hud-ink);
      font: 14px/2 var(--hud-font); user-select: none; text-align: center;
    }
    #warover-panel.open { display: flex; }
    #warover-title { font-size: 26px; letter-spacing: 8px; margin-bottom: 6px; }
    #warover-reason { color: var(--hud-dim); margin-bottom: 18px; }
    /* Sixteen carriers is sixteen score lines: the body scrolls rather than
       pushing RETURN TO PORT off a short screen. */
    #warover-body { margin-bottom: 22px; max-height: 46vh; overflow-y: auto; }
    .warover-button {
      display: block; margin: 8px auto 0; padding: 6px 26px; cursor: pointer;
      border: 1px solid var(--hud-ink); letter-spacing: 4px; width: fit-content;
    }
    .warover-button:hover { background: var(--hud-ink); color: #05070b; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/client/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="panel"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="debug-button">DBG</div>
  <div id="toast"></div>
  <div id="tip"></div>
  <div id="actions-left" class="actions"></div>
  <div id="actions-right" class="actions"></div>
  <div id="rotate-gate"></div>
  <!-- The legend is rendered from the language catalogue by main.js, and
       hides behind the ? button until asked for. -->
  <div id="help" class="hidden"></div>
  <div id="help-button">?</div>
  <div id="title-card"></div>
  <div id="sight"><span class="bar h"></span><span class="bar v"></span><span class="ring"></span></div>
  <div id="damage-panel">
    <div id="damage-title"></div>
    <canvas id="damage-view"></canvas>
    <div id="damage-list"></div>
    <div id="damage-stores"></div>
    <div id="damage-legend"></div>
  </div>
  <div id="stores-panel">
    <div id="stores-title"></div>
    <div id="stores-bias"></div>
    <div id="stores-refit"></div>
    <div id="stores-body"></div>
    <div id="stores-note"></div>
  </div>
  <div id="island-panel">
    <div id="island-title"></div>
    <div id="island-body"></div>
    <div id="island-note"></div>
  </div>
  <div id="warover-panel">
    <div>
      <div id="warover-title"></div>
      <div id="warover-reason"></div>
      <div id="warover-body"></div>
      <div id="warover-room" class="warover-button"></div>
      <div id="warover-menu" class="warover-button"></div>
      <div id="warover-watch" class="warover-button"></div>
    </div>
  </div>
  <div id="start-panel">
    <div id="start-inner">
      <div id="start-title"></div>
      <div id="start-body"></div>
      <div id="start-note"></div>
      <div id="lobby-chat" hidden>
        <div id="lobby-log"></div>
        <input id="lobby-say" maxlength="160" autocomplete="off">
      </div>
    </div>
  </div>
  <script type="module" src="/client/main.js"></script>
</body>
</html>
